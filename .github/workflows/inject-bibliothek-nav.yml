name: Bibliothek-Link in Navigation und Seitenfuß

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Bibliothek-Link automatisch')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bibliothek-Link setzen
        run: |
          python3 << 'PYEOF'
          import os, re

          BIB = 'https://www.lernolotl.de/bibliothek/autismus-adhs/'

          NAV_MARK  = '<!-- bib-nav -->'
          NAV_ITEM  = (NAV_MARK + '<li><a href="' + BIB + '" rel="noopener">'
                       '&#128218; Bibliothek</a></li>')

          BOX_MARK = '<!-- bib-box -->'
          BOX_END  = '<!-- /bib-box -->'
          BOX = BOX_MARK + '''
          <aside style="background:linear-gradient(135deg,#eef4f8 0%,#f7fbfd 100%);
            border:1px solid #cfe0ea;border-radius:12px;padding:1.1rem 1.4rem;
            margin:2rem auto;max-width:700px;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
            <div style="font-weight:700;color:#3f5a6d;margin-bottom:.35rem;">
              &#128218; Passende Geschichten und Materialien
            </div>
            <div style="font-size:.93rem;color:#4b5a63;line-height:1.55;">
              In der Lernolotl-Bibliothek findest du Vorlesegeschichten, B&uuml;cher und
              Materialien zu Autismus und ADHS &ndash; viele davon kostenlos.
              <a href="''' + BIB + '''" rel="noopener"
                 style="color:#2f6b86;font-weight:700;">Zur Bibliothek</a>
            </div>
          </aside>''' + BOX_END

          SKIP_DIRS  = ('./.github', './node_modules')
          SKIP_NAMES = {'404.html', 'cookie-banner.html'}

          nav_neu = box_neu = akt = 0

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules', '.github')]
              for fn in files:
                  if not fn.endswith('.html'): continue
                  path = os.path.join(root, fn)
                  if any(path.startswith(d) for d in SKIP_DIRS): continue
                  if fn in SKIP_NAMES or 'google' in fn.lower(): continue
                  try:
                      html = open(path, encoding='utf-8').read()
                  except Exception:
                      continue
                  orig = html

                  # --- 1) Navigationseintrag ---
                  if NAV_MARK in html:
                      html = re.sub(re.escape(NAV_MARK) + r'<li>.*?</li>', NAV_ITEM, html, flags=re.S)
                      if html != orig: akt += 1
                  else:
                      # direkt hinter dem bestehenden Lernolotl-Eintrag einhängen,
                      # sonst als letzter Punkt vor </ul> in der Hauptnavigation
                      m = re.search(r'<li><a href="https://www\.lernolotl\.de"[^>]*>.*?</a></li>', html, re.S)
                      if m:
                          html = html[:m.end()] + '\n        ' + NAV_ITEM + html[m.end():]
                          nav_neu += 1
                      else:
                          m2 = re.search(r'(<nav[^>]*>.*?<ul>)(.*?)(</ul>)', html, re.S)
                          if m2:
                              html = (html[:m2.end(2)] + '\n        ' + NAV_ITEM
                                      + html[m2.end(2):])
                              nav_neu += 1

                  # --- 2) Inhaltsbox vor dem Seitenfuß ---
                  if BOX_MARK in html:
                      html = re.sub(re.escape(BOX_MARK) + r'.*?' + re.escape(BOX_END),
                                    BOX, html, flags=re.S)
                  elif '<footer' in html:
                      i = html.index('<footer')
                      html = html[:i] + BOX + '\n' + html[i:]
                      box_neu += 1

                  if html != orig:
                      open(path, 'w', encoding='utf-8').write(html)
                      print('bearbeitet:', path)

          print(f'\nNav neu: {nav_neu} | Box neu: {box_neu} | aktualisiert: {akt}')
          PYEOF

      - name: Commit & Push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet && echo "Keine Änderungen." || (
            git commit -m "Bibliothek-Link automatisch gesetzt" &&
            git pull --rebase origin main &&
            git push
          )
